name: Create DPlus API Wheels
on:
  push:
    tags:
      - api-v*

jobs:
  # ---------------- Backend build (Windows) ----------------
  build-backend-windows:
    runs-on: windows-2022
    name: Compile Windows Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install boost
        run: |
          Invoke-WebRequest https://boost.teeks99.com/bin/1.79.0/boost_1_79_0-msvc-14.3-64.exe -OutFile boost-setup.exe
          .\boost-setup.exe /DIR=boost /SILENT | Out-Null
          move boost\lib64-msvc-14.3 boost\lib64
      - name: Set up CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Compile Backend
        env:
          BOOST_ROOT: ${{ github.workspace }}/boost
        run: |
          msbuild Dplus.sln /p:Configuration=Release /p:Platform=x64 /t:Backend\Backend:Rebuild /m
      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-release-windows
          path: x64/Release/
          retention-days: 1

  # ---------------- Wheel builds (produce artifacts only) ----------------
  windows-wheels:
    runs-on: windows-2022
    needs: build-backend-windows
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    name: Windows Wheel (py${{ matrix.python-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download backend artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-release-windows
          path: x64/Release/
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Set Python environment
        working-directory: PythonInterface
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install wheel
      - name: Build wheel
        working-directory: PythonInterface
        env:
          DPLUS_API_DEBUG: NO
          GITHUB_VERSION: ${{ github.ref }}
        run: |
          python setup.py prepare
          pip wheel . --no-build-isolation
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-py${{ matrix.python-version }}
          path: PythonInterface/dplus_api*.whl
          retention-days: 1

  manylinux-wheels:
    runs-on: ubuntu-latest
    name: Manylinux Wheels
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build docker image
        working-directory: PythonInterface
        run: docker build -f Dockerfile.manylinux .. -t dplus-api-manylinux:latest --build-arg GITHUB_VERSION=${{ github.ref }}
      - name: Copy wheels
        working-directory: PythonInterface
        run: docker run --rm --name dplus-api-manylinux -v `pwd`:/external dplus-api-manylinux:latest
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-manylinux
          path: PythonInterface/dplus-api-wheels/dplus_api*.whl
          retention-days: 1

  # ---------------- Publish stage 1: GitHub Release ----------------
  upload-release:
    runs-on: ubuntu-latest
    name: Upload all wheels to GitHub Release
    needs: [windows-wheels, manylinux-wheels]
    permissions:
      contents: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: List collected wheels
        run: ls -la dist/
      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/dplus_api*.whl
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          body: "DPlus API wheels (Windows, Manylinux)"

  # ---------------- Publish stage 2: Gemfury + PyPI ----------------
  publish-packages:
    runs-on: ubuntu-latest
    name: Publish to Gemfury and PyPI
    needs: upload-release
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: List collected wheels
        run: ls -la dist/
      - name: Upload to Gemfury
        env:
          GEMFURY_AUTH: ${{ secrets.GEMFURY_AUTH }}
        run: |
          for file in dist/dplus_api*.whl; do
            echo "Pushing $file to Gemfury"
            curl -f -F "package=@${file}" \
              https://${GEMFURY_AUTH}@push.fury.io/theresearchsoftwarecompany/
          done
      - name: Setup Python for twine
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install twine
        run: pip install --upgrade twine
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_AUTH }}
        run: twine upload --non-interactive --skip-existing dist/dplus_api*.whl
